<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Fraction Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#1d1b4b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Verdana,Arial,sans-serif;font-size:18px;color:#fff;background:#3a1a8f linear-gradient(160deg,#1b1464,#6a11cb 70%,#c2389b) fixed}
.wrap{max-width:760px;margin:auto;padding:16px}
h1{font-size:2.2em;text-align:center;margin:.3em 0;text-shadow:0 4px 0 #0005}
h1 span{color:#ffd23f}
.sub{text-align:center;margin:0 0 16px;font-size:1.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.lv{background:#fff;color:var(--ink);border:0;border-bottom:8px solid var(--k);border-radius:24px;padding:18px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.lv:hover,.lv:focus-visible{transform:translateY(-4px) rotate(-1deg)}
.lv .e{font-size:3em}.lv b{font-size:1.05em}.lv .s{color:#ffb400;font-size:1.6em;letter-spacing:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-weight:700}
.dots{display:flex;gap:8px}.dots i{width:20px;height:20px;border-radius:50%;background:#ffffff40;border:3px solid #fff}.dots i.d{background:#ffd23f}.dots i.n{box-shadow:0 0 0 4px #ffd23f80}
.ghost{background:#ffffff26;color:#fff;border:2px solid #fff;border-radius:14px;padding:8px 14px;font:inherit;font-size:.9em;cursor:pointer}
.card{background:#fff;color:var(--ink);border-radius:28px;padding:20px;text-align:center;box-shadow:0 10px 0 #0004}
.mascot{font-size:3em;animation:hop 1.6s infinite}
@keyframes hop{50%{transform:translateY(-8px)}}
h2{margin:.2em 0 .4em;font-size:1.45em}
.vis{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0;overflow-x:auto}
.eq{font-size:1.1em;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:1.3em;font-weight:800}
.qm{color:#ff4d8d;font-size:1.6em}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-weight:800;font-size:1.9em;line-height:1.1;vertical-align:middle}
.fr i{display:block;width:100%;min-width:34px;height:5px;background:currentColor;border-radius:3px;margin:3px 0}
.ch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:12px}
.c{min-height:96px;background:#f4f2ff;color:var(--ink);border:4px solid #8b7bff;border-radius:22px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;transition:transform .12s}
.c:hover:not(:disabled),.c:focus-visible{transform:scale(1.05);background:#fff}
.c.ok{background:#b9f6dc;border-color:#10b981;animation:pop .5s}
.c.no{background:#ffd6e1;border-color:#ef4444;opacity:.55;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.good{font-size:1.5em;font-weight:800;color:#059669;margin:12px 0 4px}
.try{font-size:1.2em;font-weight:700;color:#be185d;margin:12px 0 4px}
.go{background:#ff4d8d;color:#fff;border:0;border-bottom:6px solid #b3225f;border-radius:18px;padding:14px 28px;font:inherit;font-weight:800;font-size:1.1em;cursor:pointer;margin:6px}
.big{font-size:3em;letter-spacing:6px;color:#ffb400}
.cf{position:fixed;bottom:-10px;font-size:30px;animation:up 1.5s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-105vh) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const F=(n,d)=>`<span class="fr"><b>${n}</b><i></i><b>${d}</b></span>`;
const COL=['#ff4d8d','#37b6ff','#2ee6a6','#ffa23f'],CC=()=>COL[R(0,3)];
function pie(n,d,c,s=130){let o=`<svg width="${s}" height="${s}" viewBox="-52 -52 104 104" role="img" aria-label="${n} parts sur ${d}">`;const p=t=>[(48*Math.cos(t)).toFixed(1),(48*Math.sin(t)).toFixed(1)];for(let i=0;i<d;i++){const a=i*2*Math.PI/d-Math.PI/2,b=(i+1)*2*Math.PI/d-Math.PI/2,[x,y]=p(a),[u,v]=p(b);o+=`<path d="M0 0L${x} ${y}A48 48 0 0 1 ${u} ${v}Z" fill="${i<n?c:'#eef0ff'}" stroke="#1d1b4b" stroke-width="2.5"/>`}return o+'</svg>'}
const bar=(d,cl,w=280)=>{let o=`<svg width="${w}" height="46" viewBox="0 0 ${w} 46" aria-hidden="true">`;const s=(w-4)/d;for(let i=0;i<d;i++)o+=`<rect x="${2+i*s}" y="2" width="${s}" height="42" rx="4" fill="${cl[i]||'#eef0ff'}" stroke="#1d1b4b" stroke-width="2.5"/>`;return o+'</svg>'};
const cols=(d,sg)=>{const a=Array(d).fill(null);let k=0;sg.forEach(([n,c])=>{for(let i=0;i<n;i++)a[k++]=c});return a};
function cand(c,w,fn){const seen=new Set([c.join()]),o=[{h:fn(c),ok:1}];for(const x of sh(w)){if(o.length>=3)break;if(!seen.has(x.join())){seen.add(x.join());o.push({h:fn(x)})}}return sh(o)}

function q1(i){const d=[3,4,5,6,8][R(0,4)],n=R(1,d-1),c=CC();
 if(i%2==0)return{t:'Quelle fraction est coloriée ?',v:pie(n,d,c,170),hint:`Compte toutes les parts (${d}) en bas, les parts coloriées (${n}) en haut.`,
  ch:cand([n,d],[[d,n],[d-n,d],[n,d+1],[n+1,d],[n-1,d]].filter(x=>x[0]>0),x=>F(x[0],x[1]))};
 return{t:'Quelle figure montre cette fraction ?',s:`Montre ${n} sur ${d}`,v:F(n,d),hint:`Cherche la figure coupée en ${d} parts, avec ${n} part${n>1?'s':''} coloriée${n>1?'s':''}.`,
  ch:cand([n,d],[[n+1,d],[n-1,d],[d-n,d],[n,d+1],[n,d-1]].filter(x=>x[0]>=1&&x[0]<x[1]),x=>pie(x[0],x[1],c,110))}}
function q2(){const d=R(4,10);let a=R(1,d-1),b;do b=R(1,d-1);while(b==a);const big=R(0,1),c=CC();
 return{t:big?'Quelle fraction est la plus grande ?':'Quelle fraction est la plus petite ?',hint:'Même dénominateur : on compare les numérateurs (les nombres du haut).',
  ch:[a,b].map(x=>({h:F(x,d)+bar(d,cols(d,[[x,c]]),150),ok:big?x>(x==a?b:a):x<(x==a?b:a)}))}}
function q3(){const a=R(2,10);let b;do b=R(2,10);while(b==a);const big=R(0,1),c=CC();
 return{t:big?'Quelle fraction est la plus grande ?':'Quelle fraction est la plus petite ?',hint:'Plus on coupe en beaucoup de parts, plus chaque part est petite !',
  ch:[a,b].map(x=>({h:F(1,x)+bar(x,cols(x,[[1,c]]),150),ok:big?x<(x==a?b:a):x>(x==a?b:a)}))}}
function q4(){const d=R(5,10),add=R(0,1);let a,b,r;
 if(add){a=R(1,d-2);b=R(1,d-1-a);r=a+b}else{a=R(2,d-1);b=R(1,a-1);r=a-b}
 const v=add?bar(d,cols(d,[[a,'#ff4d8d'],[b,'#37b6ff']])):bar(d,cols(d,[[r,'#ff4d8d'],[b,'#b8b8c8']]));
 return{t:'Calcule !',s:`${a} sur ${d} ${add?'plus':'moins'} ${b} sur ${d}`,v:`<div>${v}<div class="eq">${F(a,d)} ${add?'+':'−'} ${F(b,d)} = <span class="qm">?</span></div></div>`,
  hint:`Le dénominateur ne change pas. On ${add?'additionne':'soustrait'} seulement les numérateurs : ${a} ${add?'+':'−'} ${b}.`,
  ch:cand([r,d],[[r,2*d],[r+1,d],[r-1,d],[a+b,d],[a,b]].filter(x=>x[0]>0),x=>F(x[0],x[1]))}}

const LV=[{n:'Écrire une fraction',e:'🍕',q:q1,k:'#ff4d8d'},{n:'Même dénominateur',e:'⚔️',q:q2,k:'#37b6ff'},{n:'Numérateur 1',e:'🚀',q:q3,k:'#2ee6a6'},{n:'Additions et soustractions',e:'🧪',q:q4,k:'#ffa23f'}];
const MSG=['Bravo ! 🎉','Super ! 🌟','Génial ! 🚀','Bien joué ! 💪','Excellent ! 🔥'],NX='<button class="go" onclick="nextQ()">Suivant ➡</button>';
const st={stars:[0,0,0,0],total:0};
function menu(){speechSynthesis.cancel();$('#app').innerHTML=`<h1>🦊 Fraction <span>Quest</span></h1><p class="sub">Choisis un monde et gagne des étoiles ! ⭐ ${st.total} points</p><div class="grid">${LV.map((l,i)=>`<button class="lv" style="--k:${l.k}" onclick="play(${i})"><span class="e">${l.e}</span><b>${l.n}</b><span class="s" aria-label="${st.stars[i]} étoiles sur 3">${'★'.repeat(st.stars[i])+'☆'.repeat(3-st.stars[i])}</span></button>`).join('')}</div>`}
function play(l){Object.assign(st,{l,i:0,fc:0,score:0});ask()}
function ask(){st.err=0;st.lock=0;const q=st.q=LV[st.l].q(st.i);
 $('#app').innerHTML=`<div class="top"><button class="ghost" onclick="menu()">⬅ Menu</button><div class="dots" aria-label="Question ${st.i+1} sur 5">${[0,1,2,3,4].map(k=>`<i class="${k<st.i?'d':k==st.i?'n':''}"></i>`).join('')}</div><div>⭐ ${st.score}</div></div>
 <div class="card"><div class="mascot">🦊</div><h2>${q.t}</h2><button class="ghost" onclick="say()">🔊 Écouter</button><div class="vis">${q.v||''}</div><div class="ch">${q.ch.map((c,i)=>`<button class="c" onclick="pick(${i})">${c.h}</button>`).join('')}</div><div id="fb" aria-live="polite"></div></div>`}
function pick(i){if(st.lock)return;const q=st.q,B=document.querySelectorAll('.c'),fb=$('#fb');
 if(q.ch[i].ok){st.lock=1;B[i].classList.add('ok');const p=st.err?5:10;if(!st.err)st.fc++;st.score+=p;fb.innerHTML=`<p class="good">${MSG[R(0,4)]} +${p}</p>`+NX;burst()}
 else{st.err++;B[i].classList.add('no');B[i].disabled=true;
  if(st.err==1)fb.innerHTML=`<p class="try">Presque ! Réessaie 💪<br><small>💡 ${q.hint}</small></p>`;
  else{st.lock=1;B.forEach((x,j)=>{if(q.ch[j].ok)x.classList.add('ok')});fb.innerHTML='<p class="try">Voici la bonne réponse 👀</p>'+NX}}}
function nextQ(){speechSynthesis.cancel();st.i++;st.i>=5?end():ask()}
function end(){const s=st.fc==5?3:st.fc>=3?2:1;st.stars[st.l]=Math.max(st.stars[st.l],s);st.total+=st.score;burst();
 $('#app').innerHTML=`<div class="card"><div class="mascot">🏆</div><h2>Monde terminé !</h2><div class="big">${'★'.repeat(s)+'☆'.repeat(3-s)}</div><p>${st.fc} réponses justes du premier coup<br>+ ${st.score} points</p><button class="go" onclick="play(${st.l})">🔁 Rejouer</button>${st.l<3?`<button class="go" onclick="play(${st.l+1})">Monde suivant ➡</button>`:''}<button class="go" onclick="menu()">🏠 Menu</button></div>`}
function say(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(st.q.s||st.q.t);u.lang='fr-FR';speechSynthesis.speak(u)}
function burst(){for(let i=0;i<16;i++){const s=document.createElement('span');s.className='cf';s.textContent=['⭐','🎉','✨','💥'][i%4];s.style.left=R(5,95)+'vw';s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2000)}}
menu();
</script></body></html>
